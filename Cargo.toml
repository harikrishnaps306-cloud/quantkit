[package]
name = "quantkit"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
authors = ["Harikrishna Paykatt Valliaparambil"]
description = "Options pricing (Black-Scholes-Merton, CRR binomial), Greeks, implied volatility and risk metrics (VaR, CVaR, Sharpe, Sortino)."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["options", "black-scholes", "greeks", "var", "quant"]
categories = ["finance", "mathematics"]
exclude = [".github/", "python/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
thiserror = "1"
libm = "0.2"

serde = { version = "1", features = ["derive"], optional = true }
rayon = { version = "1", optional = true }

[features]
default = []
## Derive `Serialize`/`Deserialize` on inputs and outputs (inputs are re-validated on deserialize).
serde = ["dep:serde"]
## Parallel batch APIs via rayon.
parallel = ["dep:rayon"]

[dev-dependencies]
serde_json = "1"
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "pricing"
harness = false

[[bench]]
name = "throughput"
harness = false
