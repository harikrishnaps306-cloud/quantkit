[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "quantkit"
description = "Options pricing, Greeks, implied volatility, Monte Carlo, vol surfaces and risk metrics (Rust core)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Harikrishna Paykatt Valliaparambil" }]
dependencies = ["numpy>=1.21"]
classifiers = [
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial",
]
dynamic = ["version"]

[tool.maturin]
module-name = "quantkit._quantkit"
python-source = "."
features = ["pyo3/extension-module"]
