[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "quantkit-rs"
description = "Options pricing, Greeks, implied volatility, Monte Carlo, vol surfaces and risk metrics (Rust core)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT.txt", "LICENSE-APACHE.txt"]
authors = [{ name = "Harikrishna Paykatt Valliaparambil" }]
dependencies = ["numpy>=1.21.6"]
classifiers = [
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/harikrishnaps306-cloud/quantkit"
Issues = "https://github.com/harikrishnaps306-cloud/quantkit/issues"
Changelog = "https://github.com/harikrishnaps306-cloud/quantkit/blob/master/CHANGELOG.md"

[tool.maturin]
module-name = "quantkit._quantkit"
python-source = "."
features = ["pyo3/extension-module"]
# python/LICENSE-*.txt are copies of the repository-root licences. They carry a .txt
# suffix so that, in an sdist (which also contains the root crate's LICENSE-MIT and
# LICENSE-APACHE at its top level), the file names do not collide, which maturin
# rejects.
